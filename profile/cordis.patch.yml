# dsh profile: subagent
#
# 供外部 harness(Cursor / Claude Code / Codex / Gemini CLI / Kiro / Qoder /
# Antigravity …)把整个 DSH 实例当作一个 subagent 调用:
#
#   dsh --profile subagent --prompt-file <任务文件> \
#       [--result-file <结果文件>] [--metadata-file <元数据 JSON>] \
#       [--provider <id>] [--model <id>]
#
#   dsh --profile subagent --print-model-catalogue
#       ↑ 只枚举 DSH 原生模型登记表并打印一行 JSON(不发模型调用、不建会话),
#         桥接层的 dsh_health / dsh_setup 用它作为模型清单的**权威来源**。
#
# cwd = 目标工作空间;stdout 只输出最终答复;退出码 0 = 正常完成。
# 会话按 DSH 常规持久化到 $DSH_HOME/sessions/<工作空间>/session-<uuid>/,
# 因此这些子代理会话可以直接在 DSH GUI 里复查。
#
# 基线是 @deepseek-ai/dsh-headless(一次性 runner)。本层只做六件事:
#   1. 换掉只认 argv 的 headless-startup,改成支持 --prompt-file / --result-file /
#      --metadata-file / --model 的解析器;
#   2. 换掉 headless-runner,改成能写结果文件与元数据、能单次指定模型的 runner;
#   3. 关掉 LLM 起标题(无人查看标题,白花一次模型调用和时延);
#   4. 审批策略固定为 never —— 子代理是非交互进程,没有人能点「同意」;
#   5. 沙箱模式由 DSH_SUBAGENT_PERMISSION 决定,默认 workspace-write
#      (工作区可读写;要全盘读写可显式给 danger-full-access,要更紧可 read-only)。
#   6. 工具呈现方式固定为 PTC(程序化工具调用):模型写一段 TypeScript,经 `run_code`
#      调度工具,而不是一次一个原生工具调用。选择点由 `DSH_TOOLS_MODE=ptc` 在起叶子进程时
#      给出(headless 的 `tools` 行读这个变量),运行时行 `ptc-runtime` 由 base 组合提供
#      (为什么不写进本文件、为什么不覆盖 `tools` 行,见第 7 条注释)。

# 1 + 2. 用本 profile 自己的启动解析器与 runner 取代 headless 的同名 row。
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

# 3. 省掉一次 LLM 调用:标题回退到首条提示词的截断版本即可。
- id: session-title-llm
  disabled: true

# 4. 非交互:一律不请求审批。
- id: approval
  config:
    policy: never

# 4.5. DSH 0.2.1 起 provider 的 `apiKeyEnv` 不再只读进程环境变量,而是先问 credentials 服务;
#      headless 组合把这一行关掉了,叶子进程于是读不到 `$DSH_HOME/.credentials.yaml` 里的 key,
#      第一次模型调用就以 MISSING_CREDENTIAL 失败(实测:0.2.1-rc.2 下所有 pi-ai 路由都如此)。
#      重新启用:该行读的是本机凭据文件,不向下游泄露任何明文。
- id: credentials
  disabled: false

# 5. 沙箱:整块 config 是浅覆盖,必须同时给出 mode 与 workspaceRoot。
- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_SUBAGENT_PERMISSION ?? process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()

# 6. 权限预设:必须与上面的 (沙箱模式, 审批策略) 组合**逐字对齐**,否则
#    dsh-permission-presets 在构造时推导不出预设、直接抛
#    「composed sandbox and approval defaults match no preset」,整棵插件树加载失败,
#    子进程在 agent 起来之前就以退出码 1 结束(实测:--permission workspace-write 必崩)。
#
#    原因是 dsh-base 自带的预设表把 workspace-write / read-only 配成 approval: ask,
#    而本 profile 第 4 条把审批固定成 never:
#        danger-full-access + never → 命中自带表 ✔
#        workspace-write   + never → 无表项 ✘ → 崩(默认档就是这一档,所以这张表是必需的)
#        read-only         + never → 无表项 ✘ → 崩
#
#    这里显式声明一张「无人值守」预设表:三种沙箱模式都配 approval: never。
#    语义上这是正确的:没有人类可以点「同意」,越界操作应当被沙箱**直接拒绝**而不是挂起等审批。
#    defaultPreset 跟沙箱模式取同一个环境变量,保证两者永远一致。
- id: permission
  config:
    defaultPreset: !!js process.env.DSH_SUBAGENT_PERMISSION ?? 'workspace-write'
    presets:
      read-only:
        sandbox: read-only
        approval: never
        name: 'read-only(无人值守)'
        description: '只读:写入与越界命令由沙箱直接拒绝,不请求审批。'
      workspace-write:
        sandbox: workspace-write
        approval: never
        name: 'workspace-write(无人值守)'
        description: '只能写工作区(workspaceRoot)与允许的临时目录;越界写入直接拒绝,不请求审批。'
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: 'danger-full-access'
        description: 'Full file access without approval prompts.'

# 7. 只做叶子:由**外部调用方**(Cursor / Claude Code / Codex …)经 dsh_task 调进来的任务
#    **不允许再分叉**。这里关掉的都是"能造出更多 agent"的工具:
#
#      tool-subagent            subagent(同进程子代理)
#      tool-subagent-fork       subagent_fork(继承上下文的子代理)
#      tool-workflow            workflow(脚本里 agent() 扇出,等于批量分叉)
#      workflow-worker-thread   workflow 的 worker 线程(没有 workflow 就用不到)
#      tool-ralph               ralph(每轮开一个新子代理)
#      tool-subagent-control    list_agents / send_message / interrupt_agent(没有子代理就无事可做)
#      tool-subagent-list-agents
#
#    只关**工具**,不关服务(subagent 服务保持加载):没有工具就没有调用者,而关服务会让
#    inject 这些服务的插件加载失败,风险大收益小。
#
#    实测(0.1.5-rc.1):base bundles 已经把 subagent-spawn-in-process / subagent-fork-in-process
#    这两个"进程内分叉"服务行全局关掉了(subagent 与 desktop profile 的 --dump-config 都是关闭)。
#    我们**不去补丁**它们:关着当然更好,但那是上游默认,不是我们承诺的边界 ——
#    这里的边界只由下面 7 行工具定义(工具没了,就没有调用者)。
#
#    ⚠️ 这条闸门只管**进程内**的分叉通道。DSH 自己内部派活走的是原生 subagent(桌面 profile),
#    不受影响;另外任何有 shell 的 agent 都能自己起一个 dsh 进程,那属于"本来就有终端权限"的
#    范畴,不作为可执行边界来承诺(任务现场与审计仍完整落盘)。
- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: tool-workflow
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-ralph
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- insert:
    - id: subagent-startup
      name: './subagent-startup.js'
    - id: subagent-runner
      name: './subagent-runner.js'
      inject: [subagentStartup]
      config:
        task: !!js ctx.subagentStartup.task
        resultFile: !!js ctx.subagentStartup.resultFile
        metadataFile: !!js ctx.subagentStartup.metadataFile
        provider: !!js ctx.subagentStartup.provider
        model: !!js ctx.subagentStartup.model
        reasoningEffort: !!js ctx.subagentStartup.reasoningEffort
        printCatalogue: !!js ctx.subagentStartup.printCatalogue

    # 只枚举、不推理:`--print-model-catalogue` 时把 DSH 原生模型登记表打给桥接层。
    # 桥接层(MCP/CLI)在 DSH 外面,以前靠自己手写解析 profile patch 与 settings.yaml 猜
    # "这个实例有哪些模型";现在直接问登记表,猜的那一段只作为探针不可用时的兜底。
    - id: subagent-models
      name: './subagent-models.js'
      inject: [subagentStartup]
      config:
        printCatalogue: !!js ctx.subagentStartup.printCatalogue

    # 7. 工具呈现方式:PTC(程序化工具调用)。DSH 0.2.1 里这条选择在 `dsh-tools` 那一行上
    #    (`config.mode: native | ptc`),`tool-presentation` 行只是**预设**用来覆盖它的手段:
    #    `presentAs()` 声明的是"预设常驻挂载作用域",只覆盖加入该预设的 agent。叶子 profile
    #    不经过预设注册表(headless 直接 `agents.create`),把 `tool-presentation` 挂在组合层
    #    等于没声明 —— 实测:该行在场时模型仍拿到全部原生 schema、工具清单里没有 `run_code`。
    #    也不能在这里覆盖 `tools` 行:profile patch 用 `- id: tools` 改它的 config,会撞上
    #    "its declared dsh requirements cannot be validated" 的校验崩溃(实测),整棵插件树起不来。
    #    所以改用 headless 自己留的那个开关:它在挂载时读 `process.env.DSH_TOOLS_MODE`
    #    (未设即 native)。由 lib/tasks.mjs 起叶子进程时设成 `ptc`;单独跑 `--profile subagent`
    #    时手动 export 同名变量即可拿到同样的形态。
    #    `ptc` 需要宿主平面的 `ptcRuntime`(base 已组合 `ptc-runtime` + TypeScript SDK 渲染器),
    #    缺了会在组装提示词时直接拒绝。

# 8. LLM 服务商与默认模型 —— 本机私有,不进公开仓库
#    叶子进程(`dsh --profile subagent`)必须能解析到服务商,否则 dsh_task 一起来就报
#    「no adapter registered for provider …」。而 provider 配置里带着内网网关地址与密钥
#    环境变量名,属于机器本地信息,不能提交到公开仓库。
#    所以这段由 install.mjs 在安装时从**本机自己的配置**里取出来,写进
#    `$DSH_HOME/profiles/subagent/cordis.patch.yml` 尾部那个 `dsh-subagent-llm-providers`
#    标记块里 —— 那个文件在仓库之外(仓库是 `$DSH_HOME/subagent`),不会被提交。取用顺序:
#      1. `DSH_SUBAGENT_PROVIDERS_FILE` 指定的 patch 片段(整份当 provider 块用);
#      2. `$DSH_HOME/llm-providers.patch.yml`(自己放的片段);
#      3. 否则从本机已有配置里抽 `llm-pi-ai` 条目:desktop profile 的 patch → home 层
#         → settings.yaml.imported → settings.yaml(0.1.7 之前的位置)。
#    改默认模型请改 config/model-policy.md;改 provider 请改上面那份本机文件后重跑 install。
